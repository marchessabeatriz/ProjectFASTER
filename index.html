<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project FASTER</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#edf4ff,#fff8e8);
    margin:0;
    padding:20px;
}

.card{

    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);
    border-top:8px solid #003399;

}

.header{
    background:#003399;
    color:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
}

.logos{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    width:80px;
    height:80px;
    object-fit:contain;
    background:white;
    padding:5px;
    border-radius:50%;
}

.title{
    flex:1;
    text-align:center;
}

.header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}

.header h2{
    margin:5px 0;
    color:white;
}

.header p{
    margin:5px 0 0;
    color:#eeeeee;
}


#content{

    text-align:center;

}


img{

    width:300px;
    max-width:100%;
    border-radius:15px;
    margin:20px auto;
}


table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}


td{

    padding:12px;
    border-bottom:1px solid #ddd;

}


td:first-child{

    font-weight:bold;
    color:#006633;
    width:40%;

}


.status{

    padding:6px 12px;
    border-radius:20px;
    background:#dff5df;
    color:#006633;
    font-weight:bold;

}


.footer{

    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:#777;

}


</style>

</head>


<body>


<div class="card">


<div class="header">

<div class="logos">

<img src="deped-logo.png" class="logo">

<div class="title">

<h1>PROJECT FASTER</h1>

<h2>Mambago-A Elementary School</h2>

<p>Fixed Assets and Supplies Tracking through Electronic Records</p>

</div>

<img src="maes-logo.png" class="logo">

</div>

</div>



<div id="content">

Loading asset...

</div>



<div class="footer">

<strong>Department of Education</strong><br>

Mambago-A Elementary School<br>

Project FASTER<br>

School Year 2026–2027

</div>



</div>




<script>


const params=new URLSearchParams(window.location.search);

const assetID=params.get("id");



fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTpbKjz1OdKV0DfYzeUVVUWuYr_E1ehDhMR1uSgYc6imNyqtrWcEKJwlkhkFGRQiQ/pub?output=csv")

.then(response=>response.text())

.then(data=>{


const rows=data.trim().split("\n");

const headers=rows[0].split(",");



const assets=rows.slice(1).map(row=>{


const values=row.split(",");

let obj={};


headers.forEach((header,index)=>{

obj[header.trim()]=values[index];

});


return obj;


});



const asset=assets.find(a=>a["Asset ID"]===assetID);



if(!asset){


document.getElementById("content").innerHTML=

"<h2>Asset not found.</h2>";


return;


}




document.getElementById("content").innerHTML=`

${asset["Photo"] ? `<img src="${asset["Photo"]}">` : ""}


<table>


<tr>
<td>Asset ID</td>
<td>${asset["Asset ID"]}</td>
</tr>


<tr>
<td>Property No.</td>
<td>${asset["Property No."]}</td>
</tr>


<tr>
<td>Item</td>
<td>${asset["Item"]}</td>
</tr>


<tr>
<td>Description</td>
<td>${asset["Description"]}</td>
</tr>


<tr>
<td>Brand</td>
<td>${asset["Brand"]}</td>
</tr>


<tr>
<td>Serial No.</td>
<td>${asset["Serial No."]}</td>
</tr>


<tr>
<td>Accountable Person</td>
<td>${asset["Accountable Person"]}</td>
</tr>


<tr>
<td>Room</td>
<td>${asset["Room"]}</td>
</tr>


<tr>
<td>Condition</td>
<td>${asset["Condition"]}</td>
</tr>


<tr>
<td>Status</td>
<td><span class="status">${asset["Status"]}</span></td>
</tr>


<tr>
<td>PAR</td>
<td>${asset["PAR"]}</td>
</tr>



</table>


`;



});


</script>


</body>

</html>
