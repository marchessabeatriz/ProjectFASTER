<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project FASTER</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#edf4ff,#fff8e8);
    margin:0;
    padding:20px;
}

.card{
    max-width:1000px;
    width:100%;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);
    border-top:8px solid #003399;
    box-sizing:border-box;
}

.header{
    background:#003399;
    color:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
}

.logos{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    background:white;
    padding:5px;
    border-radius:50%;
    flex-shrink:0;
}

.title{
    flex:1;
    text-align:center;
}

.header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}

.header h2{
    margin:5px 0;
    color:white;
}

.header p{
    margin:5px 0 0;
    color:#eeeeee;
}


#content{

    text-align:center;

}


img{

    width:300px;
    max-width:100%;
    border-radius:15px;
    margin:20px auto;
}


table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}


td{

    padding:12px;
    border-bottom:1px solid #ddd;

}


td:first-child{

    font-weight:bold;
    color:#006633;
    width:40%;

}


.status{

    padding:6px 12px;
    border-radius:20px;
    background:#dff5df;
    color:#006633;
    font-weight:bold;

}


.footer{

    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:#777;

}
/* ===========================
   MOBILE RESPONSIVE DESIGN
=========================== */

@media (max-width:768px){

    body{
        padding:10px;
    }

    .card{
        width:100%;
        padding:18px;
        box-sizing:border-box;
    }

    .logos{
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:10px;
    }

    .logo{
        width:60px;
        height:60px;
    }

    h1{
        font-size:24px;
        text-align:center;
    }

    h2{
        font-size:20px;
        text-align:center;
    }

    h3{
        font-size:16px;
        text-align:center;
    }

    table{
        width:100%;
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

    td,
    th{
        font-size:14px;
        padding:8px;
    }

    img{
        max-width:100%;
        height:auto;
    }

}

</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>


<body>


<div class="card">


<div class="header">

<div class="logos">

<img src="deped-logo.png" class="logo">

<div class="title">

<h1>PROJECT FASTER</h1>

<h2>Mambago-A Elementary School</h2>

<p>Fixed Assets and Supplies Tracking through Electronic Records</p>

</div>

<img src="maes-logo.png" class="logo">

</div>

</div>



<div id="content">

Loading asset...

</div>



<div class="footer">

<strong>Department of Education</strong><br>

Mambago-A Elementary School<br>

Project FASTER<br>

School Year 2026–2027

</div>



</div>




<script>


const params=new URLSearchParams(window.location.search);

const assetID=params.get("id");



fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTpbKjz1OdKV0DfYzeUVVUWuYr_E1ehDhMR1uSgYc6imNyqtrWcEKJwlkhkFGRQiQ/pub?output=csv")

.then(response=>response.text())

.then(data=>{


const assets = Papa.parse(data, {
    header: true,
    skipEmptyLines: true
}).data;



const asset=assets.find(a=>a["Asset ID"]===assetID);



if(!asset){


document.getElementById("content").innerHTML=

"<h2>Asset not found.</h2>";


return;


}




document.getElementById("content").innerHTML=`

${asset["Photo"] ? `<img src="${asset["Photo"]}">` : ""}


<table>


<tr>
<td>Asset ID</td>
<td>${asset["Asset ID"]}</td>
</tr>


<tr>
<td>Property No.</td>
<td>${asset["Property No."]}</td>
</tr>


<tr>
<td>Item</td>
<td>${asset["Item"]}</td>
</tr>


<tr>
<td>Description</td>
<td>${asset["Description"]}</td>
</tr>


<tr>
<td>Brand</td>
<td>${asset["Brand"]}</td>
</tr>


<tr>
<td>Serial No.</td>
<td>${asset["Serial No."]}</td>
</tr>


<tr>
<td>Accountable Person</td>
<td>${asset["Accountable Person"]}</td>
</tr>


<tr>
<td>Room</td>
<td>${asset["Room"]}</td>
</tr>


<tr>
<td>Condition</td>
<td>${asset["Condition"]}</td>
</tr>


<tr>
<td>Status</td>
<td><span class="status">${asset["Status"]}</span></td>
</tr>


<tr>
<td>PAR</td>
<td>${asset["PAR"]}</td>
</tr>



</table>


`;



});


</script>


</body>

</html>
