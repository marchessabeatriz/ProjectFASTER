<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project FASTER - Property Accountability Profile</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef5f5;
    margin:0;
    padding:25px;
}

.card{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#163c96;
}

h2{
    color:#006633;
    margin-top:10px;
}

.info-table{

    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;

}

.info-table td{

    border:1px solid #ddd;
    padding:12px;

}

.info-table td:first-child{

    width:220px;
    background:#f3f6fb;
    font-weight:bold;

}

.asset-table{

    width:100%;
    border-collapse:collapse;

}

.asset-table th{

    background:#163c96;
    color:white;
    padding:12px;

}

.asset-table td{

    border-bottom:1px solid #ddd;
    padding:12px;

}

.asset-table tr:nth-child(even){

    background:#f8f8f8;

}

.asset-table tr:hover{

    background:#eef4ff;

}

.asset-table a{

    color:#163c96;
    font-weight:bold;
    text-decoration:none;

}

.asset-table a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<h1>Property Accountability Profile</h1>

<div id="content">
Loading employee...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const teacherID = (params.get("teacher") || "").trim();

fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTpbKjz1OdKV0DfYzeUVVUWuYr_E1ehDhMR1uSgYc6imNyqtrWcEKJwlkhkFGRQiQ/pub?output=csv")

.then(response => response.text())

.then(data => {

const assets = Papa.parse(data,{
    header:true,
    skipEmptyLines:true
}).data;

const teacherAssets = assets.filter(a =>
    a["Employee ID"] &&
    a["Employee ID"].trim() === teacherID.trim()
);

if(teacherAssets.length === 0){

let html = `

<div class="card">

<h1>Property Accountability Profile</h1>

<h2>${employeeName}</h2>

<table class="info-table">

<tr>
<td>Employee ID</td>
<td>${teacherID}</td>
</tr>

<tr>
<td>Position</td>
<td>${position}</td>
</tr>

<tr>
<td>Total Accountable Assets</td>
<td>${teacherAssets.length}</td>
</tr>

</table>

<h3>Assigned Properties</h3>

<table class="asset-table">

<tr>

<th>Asset ID</th>

<th>Item</th>

<th>Status</th>

</tr>

`;

teacherAssets.forEach(asset=>{

html += `

<tr>

<td>
<a href="index.html?id=${asset["Asset ID"]}" target="_blank">
${asset["Asset ID"]}
</a>
</td>

<td>${asset["Item"]}</td>

<td>${asset["Status"]}</td>

</tr>

`;

html += `

</tbody>

</table>

</div>

`;

document.getElementById("content").innerHTML = html;

return;

}

const employeeName = teacherAssets[0]["Accountable Person"];
const position = teacherAssets[0]["Position"];

let html = `

<h2>${employeeName}</h2>

<p><strong>Position:</strong> ${position}</p>

<p><strong>Employee ID:</strong> ${teacherID}</p>

<p><strong>Total Accountable Assets:</strong> ${teacherAssets.length}</p>

<table>

<tr>

<th>Asset ID</th>

<th>Item</th>

<th>Status</th>

</tr>

`;

teacherAssets.forEach(asset=>{

html += `

<tr>

<td>
<a href="index.html?id=${asset["Asset ID"]}" target="_blank">
${asset["Asset ID"]}
</a>
</td>

<td>${asset["Item"]}</td>

<td>${asset["Status"]}</td>

</tr>

`;

});

html += `

</table>

</div>

`;

document.getElementById("content").innerHTML = html;

});

</script>

</body>

</html>
