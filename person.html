<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project FASTER - Property Accountability Profile</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef5f5;
    margin:0;
    padding:25px;
}

.card{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.banner{
    background:#163c96;
    color:white;
    text-align:center;
    padding:25px;
}

.banner h1{
    margin:0;
    color:#FFD700;
    font-size:38px;
}

.banner h2{
    margin:8px 0;
    font-size:26px;
}

.banner p{
    margin:0;
    font-size:18px;
}

.content{
    padding:30px;
}

.employee-name{
    text-align:center;
    color:#006633;
    font-size:32px;
    margin-bottom:25px;
}

.info-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

.info-table td{
    border:1px solid #ddd;
    padding:12px;
}

.info-table td:first-child{
    width:260px;
    background:#163c96;
    color:white;
    font-weight:bold;
}

.asset-table{
    width:100%;
    border-collapse:collapse;
}

.asset-table th{
    background:#006633;
    color:white;
    padding:12px;
}

.asset-table td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.asset-table tr:nth-child(even){
    background:#f8f8f8;
}

.asset-table tr:hover{
    background:#eef5ff;
}

.asset-table a{
    color:#163c96;
    font-weight:bold;
    text-decoration:none;
}

.asset-table a:hover{
    text-decoration:underline;
}

.status{
    background:#dff5df;
    color:#006633;
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#777;
    padding:20px;
    font-size:13px;
}

</style>

</head>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;

}

.card{

h1{

</head>

<body>

<body>

<div id="content">
Loading employee...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const teacherID = (params.get("teacher") || "").trim();

fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTpbKjz1OdKV0DfYzeUVVUWuYr_E1ehDhMR1uSgYc6imNyqtrWcEKJwlkhkFGRQiQ/pub?output=csv")

.then(response => response.text())

.then(data => {

const assets = Papa.parse(data,{
    header:true,
    skipEmptyLines:true
}).data;

const teacherAssets = assets.filter(a =>
    a["Employee ID"] &&
    a["Employee ID"].trim() === teacherID.trim()
);

if(teacherAssets.length === 0){

}

const employeeName = teacherAssets[0]["Accountable Person"];
const position = teacherAssets[0]["Position"];

let html = `

let html = `

<div class="card">

<div class="banner">

<h1>PROJECT FASTER</h1>

<h2>Mambago-A Elementary School</h2>

<p>Property Accountability Profile</p>

</div>

<div class="content">

<h2 class="employee-name">${employeeName}</h2>

<table class="info-table">

<tr>
<td>Employee ID</td>
<td>${teacherID}</td>
</tr>

<tr>
<td>Position</td>
<td>${position}</td>
</tr>

<tr>
<td>Total Accountable Assets</td>
<td>${teacherAssets.length}</td>
</tr>

</table>

<h3>Assigned Properties</h3>

<table class="asset-table">

<tr>

<th>Asset ID</th>

<th>Item</th>

<th>Status</th>

</tr>

`;

teacherAssets.forEach(asset=>{

html += `

<tr>

<td>

<a href="index.html?id=${asset["Asset ID"]}" target="_blank">

${asset["Asset ID"]}

</a>

</td>

<td>${asset["Item"]}</td>

<td>

<span class="status">

${asset["Status"]}

</span>

</td>

</tr>

`;

});

html += `

</table>

</div>

<div class="footer">

Generated by Project FASTER<br>

Mambago-A Elementary School<br>

Department of Education

</div>

</div>

`;

document.getElementById("content").innerHTML = html;

});

</script>

</body>

</body>

</html>
